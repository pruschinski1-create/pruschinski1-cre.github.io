name: Keep Supabase Alive - Lave Interiores

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_LAVE }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_LAVE }}
        run: |
          http_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" "${SUPABASE_URL}/rest/v1/" -H "apikey: ${SUPABASE_KEY}")
          echo "HTTP status: $http_code"
          cat /tmp/response.txt
