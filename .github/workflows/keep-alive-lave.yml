name: Keep Supabase Alive - Lave Interiores
 
on:
  schedule:
    # Roda toda segunda e quinta às 09:00 UTC (06:00 no horário de Brasília)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {} # permite rodar manualmente pelo GitHub também
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_LAVE }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_LAVE }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
 
          echo "HTTP status: $response"
 
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Ping bem-sucedido - Lave Interiores continua ativo"
          else
            echo "⚠️ Resposta inesperada - verifique manualmente"
            exit 1
          fi
 
